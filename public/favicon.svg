  <path d="M8 49c9-1 11-11 19-10" stroke="#81B29A" stroke-width="1.2" stroke-dasharray="2.5 3" stroke-linecap="round" />
  <circle cx="8" cy="45" r="2.5" fill="#F4F1DE" />
